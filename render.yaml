services:
  - type: web
    name: neon-beat-rush
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TIKTOK_USER
        sync: false        # tu usuario de TikTok, sin @ (puedes dejarlo vacío y ponerlo desde el juego)
      - key: EULER_API_KEY
        sync: false        # opcional: clave de eulerstream.com para más estabilidad
      - key: ADMIN_KEY
        generateValue: true  # clave para cambiar el usuario de TikTok desde el juego
